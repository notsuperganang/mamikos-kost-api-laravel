services:
  postgres:
    image: postgres:18-alpine
    container_name: mamikos-laravel-postgres
    environment:
      POSTGRES_DB: mamikos_laravel
      POSTGRES_USER: mamikos
      POSTGRES_PASSWORD: mamikos
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mamikos -d mamikos_laravel"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: mamikos-laravel-api
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Run 'php artisan key:generate --show' and export APP_KEY}
      APP_URL: http://localhost:${API_PORT:-8000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: mamikos_laravel
      DB_USERNAME: mamikos
      DB_PASSWORD: mamikos
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CREDITS_TIMEZONE: ${CREDITS_TIMEZONE:-Asia/Jakarta}
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  postgres-data:
